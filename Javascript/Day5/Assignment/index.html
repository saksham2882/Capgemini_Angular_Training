<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Product Inventory Management System</h1>
    </header>

    <div id="loader">
        <div class="spin"></div>
        <p>Loading Products...</p>
    </div>

    <div class="box">
        <section class="alert-section">
            <h3>Low Stock Alerts</h3>
            <div id="stockAlerts"></div>
        </section>

        <section class="dashboard">
            <div class="card">
                <h3>Total Products</h3>
                <p id="totalProducts">0</p>
            </div>

            <div class="card">
                <h3>Total Inventory Value</h3>
                <p id="inventoryValue">Rs.0</p>
            </div>

            <div class="card">
                <h3>Total Categories</h3>
                <p id="totalCategories">0</p>
            </div>

            <div class="card">
                <h3>Total Operations</h3>
                <p id="operationsCount">0</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Add Product</h2>

            <form id="productForm">
                <input type="text" id="name" placeholder="Enter product name" required>
                <input type="text" id="category" placeholder="Enter category" required>
                <input type="number" id="price" min="0" placeholder="Enter price" required>
                <input type="number" id="quantity" min="1" placeholder="Enter quantity" required>
                <button type="submit">Add Product</button>
            </form>
        </section>

        <section class="filter-section">
            <h2>Filters & Search</h2>
            <input type="text" id="searchInput" placeholder="Search Product...">

            <select id="categoryFilter">
                <option value="All">All Categories</option>
            </select>

            <div class="priceFilter">
                <input type="number" id="minPrice" placeholder="Enter min price">
                <input type="number" id="maxPrice" placeholder="Enter max price">
            </div>

            <button id="filterBtn">Apply Filters</button>
        </section>

        <section>
            <h2>Products</h2>
            <div id="productsGrid"></div>
        </section>

        <section class="pagination">
            <button id="prev">Previous</button>
            <span id="curr">1</span>
            <button id="next">Next</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
