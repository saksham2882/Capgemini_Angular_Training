<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <h1>Student Performance Analysis System</h1>

        <div>
            <h2>Add Student</h2>

            <input type="number" id="id" min="0" placeholder="Enter student ID">
            <input type="text" id="name" placeholder="Enter student name">
            <input type="number" id="age" min="18" placeholder="Enter student age">

            <input type="text" id="subjects" placeholder="Enter subjects (comma separated)">
            <input type="text" id="scores" placeholder="Enter scores (comma separated)">

            <button onclick="addStudent()">Add Student</button>
        </div>

        <div>
            <h2>Search / Filter</h2>
            <input type="text" id="searchName" placeholder="Search by Name">
        
            <select id="gradeFilter" onchange="renderStudents()">
                <option value="">Filter by Grade</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="F">F</option>
            </select>
        
            <select id="subjectFilter" onchange="renderStudents()">
                <option value="">Filter by Subject</option>
            </select>
        </div>

        <div>
            <div>
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>
            <div>
                <h3>Class Average</h3>
                <p id="classAverage">0</p>
            </div>
            <div>
                <h3>Grade Distribution</h3>
                <p id="gradeDistribution"></p>
            </div>
            <div>
                <h3>Subjects Offered</h3>
                <p id="subjectsOffered"></p>
            </div>
        
        </div>


        <div class="table-section">
            <h2>Students Table</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Subjects</th>
                        <th>Scores</th>
                        <th>Average</th>
                        <th>Grade</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>
        </div>

        <div class="leaderboard">
            <h2>Leaderboard</h2>
            <div id="leaderboard"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
